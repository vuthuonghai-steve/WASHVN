skill_name: "build-v10-final"
stage: "exploration"
glossary:
  - term: "Domain Anchoring"
    definition: "Neo LLM vào đúng không gian vector nghiệp vụ trước khi suy luận."
  - term: "Thought Block"
    definition: "Phân tích sâu ≥200 từ, làm mỏ neo vector ngữ nghĩa."
  - term: "Hydrated Context"
    definition: "Gói ngữ cảnh cô đặc: glossary, NFR, edge cases, data contracts, zone map, must_not."
  - term: "Dual Context Ingestion"
    definition: "Hai luồng song song: technical (hydrated) + cognitive (thought-cache)."
  - term: "SCS"
    definition: "Điểm phức tạp 1.0-5.0; <3.0 Fast Track, ≥3.0 Full Track."
  - term: "Binary Gate"
    definition: "Gate nhị phân deterministic, verify bằng script (không NLP)."
  - term: "META-2.1"
    definition: "4 Depth Signals S1-S4; PASS iff S1∧S2∧S3∧S4."
  - term: "YAML Resilience"
    definition: "Middleware L1-L3 tự sửa YAML trước khi commit Context Bus."
  - term: "Negative Space"
    definition: "Điều hệ thống KHÔNG được làm; must_not + anti-patterns."
  - term: "Context Bus"
    definition: "Shared state layer, Single Source of Truth giữa các stage."
nfr:
  - id: "NFR-01"
    requirement: "Hydrated-context YAML validate trước handoff."
    constraint: "hard"
  - id: "NFR-02"
    requirement: "Glossary ≥10 thuật ngữ chuyên ngành."
    constraint: "hard"
edge_cases:
  - scenario: "skill_name không kebab-case"
    expected: "Schema reject với message rõ ràng."
  - scenario: "Glossary <10 entries"
    expected: "Validation fail minItems; pipeline block."
data_contracts:
  input: "exploration.md parse thành YAML fields."
  output: "hydrated-context.yaml validated → planner + builder."
zone_map: {core: ["SKILL.md"], knowledge: ["knowledge/*.md"], policy: ["policy/*.md"], loop: ["loop/*.md"], scripts: ["scripts/*.py"], templates: ["templates/*.template"], data: ["data/*.yaml"], schemas: ["schemas/*.schema.yaml"]}
must_not:
  - "Speculative features không trace từ exploration report."
  - "Placeholder (TODO/FIXME) trong output YAML."
  - "Contradict must_not của exploration report."
