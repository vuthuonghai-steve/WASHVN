$schema: "http://json-schema.org/draft-07/schema#"
$id: "washvn://schemas/review-report"
title: "Review Report Schema"
description: "Validation schema for review-report.md (Stage 3.5 — Code Reviewer output)"
type: "object"
required:
  - skill_name
  - review_verdict
  - gate_results
  - findings
additionalProperties: false
properties:
  skill_name:
    type: "string"
    pattern: "^[a-z][a-z0-9-]*$"
    description: "The unique name of the skill in kebab-case"
  review_verdict:
    type: "string"
    enum:
      - PASS
      - FAIL
      - REFACTOR_REQUIRED
  gate_results:
    type: "array"
    items:
      type: "object"
      required:
        - gate_id
        - status
        - finding
      additionalProperties: false
      properties:
        gate_id:
          type: "string"
        status:
          type: "string"
          enum: ["pass", "fail", "warning"]
        finding:
          type: "string"
  findings:
    type: "array"
    items:
      type: "object"
      required:
        - severity
        - file
        - line
        - description
      additionalProperties: false
      properties:
        severity:
          type: "string"
          enum: ["critical", "major", "minor", "info"]
        file:
          type: "string"
        line:
          type: "integer"
          minimum: 1
        description:
          type: "string"
  external_validator_invoked:
    type: "boolean"
  refactor_recommendations:
    type: "array"
    items:
      type: "string"
