$schema: "http://json-schema.org/draft-07/schema#"
$id: "washvn://schemas/design"
title: "Design Schema"
description: "Validation schema for design.md (Stage 1 — skill-architect output)"
type: "object"
required:
  - skill_name
  - target_variable
  - zone_mapping
  - data_contracts
  - state_machine
  - must_not_rules
additionalProperties: false
properties:
  skill_name:
    type: "string"
    pattern: "^[a-z][a-z0-9-]*$"
    description: "The unique name of the skill in kebab-case"
  target_variable:
    type: "string"
    description: "The main variable or core functionality targeted by the design"
  zone_mapping:
    type: "object"
    required:
      - core
      - knowledge
      - scripts
      - templates
      - data
      - loop
      - assets
    additionalProperties: false
    properties:
      core:
        $ref: "#/definitions/zone_def"
      knowledge:
        $ref: "#/definitions/zone_def"
      scripts:
        $ref: "#/definitions/zone_def"
      templates:
        $ref: "#/definitions/zone_def"
      data:
        $ref: "#/definitions/zone_def"
      loop:
        $ref: "#/definitions/zone_def"
      assets:
        $ref: "#/definitions/zone_def"
    description: "7-Zone architectural mapping for the skill"
  data_contracts:
    type: "array"
    minItems: 1
    items:
      type: "object"
      required:
        - contract_id
        - description
        - input_schema
        - output_schema
      additionalProperties: false
      properties:
        contract_id:
          type: "string"
        description:
          type: "string"
        input_schema:
          type: "string"
        output_schema:
          type: "string"
    description: "I/O data contracts between components"
  state_machine:
    type: "object"
    required:
      - initial_state
      - states
      - transitions
    additionalProperties: false
    properties:
      initial_state:
        type: "string"
      states:
        type: "array"
        items:
          type: "string"
      transitions:
        type: "array"
        items:
          type: "object"
          required:
            - from
            - to
            - trigger
          additionalProperties: false
          properties:
            from:
              type: "string"
            to:
              type: "string"
            trigger:
              type: "string"
  must_not_rules:
    type: "array"
    minItems: 5
    items:
      type: "string"
    description: "Anti-rules to enforce sandbox safety and constraint limits (min 5 rules)"
  semantic_anchors:
    type: "array"
    items:
      type: "string"
  phase_deconstruction:
    type: "array"
    items:
      type: "object"
      required:
        - phase_id
        - name
        - description
      properties:
        phase_id:
          type: "string"
        name:
          type: "string"
        description:
          type: "string"
  quality_gates:
    type: "array"
    items:
      type: "string"

definitions:
  zone_def:
    type: "object"
    required:
      - purpose
      - files
      - constraints
    additionalProperties: false
    properties:
      purpose:
        type: "string"
      files:
        type: "array"
        items:
          type: "string"
      constraints:
        type: "array"
        items:
          type: "string"
