$schema: "http://json-schema.org/draft-07/schema#"
$id: "washvn://schemas/todo"
title: "Todo Schema"
description: "Validation schema for todo.md (Stage 2 — skill-planner output)"
type: "object"
required:
  - skill_name
  - tasks
  - dag_dependencies
  - total_tasks
additionalProperties: false
properties:
  skill_name:
    type: "string"
    pattern: "^[a-z][a-z0-9-]*$"
    description: "The unique name of the skill in kebab-case"
  tasks:
    type: "array"
    minItems: 1
    items:
      type: "object"
      required:
        - task_id
        - description
        - zone
        - priority
        - input_schema
        - output_schema
        - verification_cmd
        - must_not
      additionalProperties: false
      properties:
        task_id:
          type: "string"
        description:
          type: "string"
        zone:
          type: "string"
          enum: [core, knowledge, scripts, templates, data, loop, assets]
        priority:
          type: "string"
          enum: [high, medium, low]
        input_schema:
          type: ["string", "null"]
        output_schema:
          type: ["string", "null"]
        verification_cmd:
          type: "string"
        must_not:
          type: "array"
          items:
            type: "string"
  dag_dependencies:
    type: "array"
    items:
      type: "object"
      required:
        - from
        - to
      additionalProperties: false
      properties:
        from:
          type: "string"
        to:
          type: "string"
  total_tasks:
    type: "integer"
    minimum: 1
  plan_verification:
    type: "object"
    additionalProperties: true
  token_budget:
    type: "object"
    additionalProperties: true
  fallback_task_map:
    type: "array"
    items:
      type: "object"
      required:
        - f_code
        - task_id
      properties:
        f_code:
          type: "string"
        task_id:
          type: "string"
