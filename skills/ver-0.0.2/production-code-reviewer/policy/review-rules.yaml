# ===========================================================================
# GOOGLE CODE REVIEW RULES — Severity Schema (68 Rules)
# ===========================================================================
# Source of truth for the severity label and category of each Google review
# rule. The actual check implementations live in scripts/auditor/checks.py.
# This file is consumed by the LLM reviewer to map rule_id -> label/category
# when composing review-report.md.
# ===========================================================================

# Severity buckets (mirror scripts/auditor/rules.py)
severity_labels:
  must_fix:
    prefix: "Must Fix: "
    meaning: "Critical issue affecting correctness, security, concurrency, or architecture. Blocking — must be resolved before approval."
  optional:
    prefix: "Optional: "
    meaning: "Valid suggestion that could improve design but not critical. Non-blocking."
  fyi:
    prefix: "FYI: "
    meaning: "Knowledge sharing, learning resource, or contextual tip. Non-blocking — no action required."
  nit:
    prefix: "Nit: "
    meaning: "Minor aesthetic or stylistic suggestion. Non-blocking — author can ignore."

# Category buckets (mirror policy/review-rules.yaml + scripts/auditor/checks.py)
categories:
  design:
    title: "Software Design & Decoupling (15 rules)"
    rule_id_prefix: "REV-DES"
  functionality:
    title: "Correctness, Security & Concurrency (15 rules)"
    rule_id_prefix: "REV-FUN"
  complexity:
    title: "Simplicity & Clean Code (10 rules)"
    rule_id_prefix: "REV-CMP"
  testing:
    title: "Test Coverage & Quality (8 rules)"
    rule_id_prefix: "REV-TST"
  style:
    title: "Style & Naming Standards (8 rules)"
    rule_id_prefix: "REV-STY"
  comments:
    title: "Comments & Documentation (7 rules)"
    rule_id_prefix: "REV-CMT"
  cl_size:
    title: "CL Size & Scope (5 rules)"
    rule_id_prefix: "REV-SIZ"

# Authoritative rule_id registry — the LLM reviewer and the auditor must agree.
# Severity listed here is the auditor's programmatic default; the LLM may
# escalate to Must Fix: when context warrants.
rules:
  - {id: REV-DES-01, severity: blocking, name: "Single Responsibility Principle"}
  - {id: REV-DES-02, severity: blocking, name: "Speculative Programming"}
  - {id: REV-DES-03, severity: blocking, name: "Dependency Injection"}
  - {id: REV-DES-04, severity: blocking, name: "Global State Mutation"}
  - {id: REV-DES-05, severity: blocking, name: "Tightly Coupled Submodules"}
  - {id: REV-DES-06, severity: blocking, name: "Module Placement Hygiene"}
  - {id: REV-DES-07, severity: blocking, name: "Encapsulation Violation"}
  - {id: REV-DES-08, severity: optional, name: "Class Length / Inheritance Depth"}
  - {id: REV-DES-09, severity: blocking, name: "Interface/Abstract Compliance"}
  - {id: REV-DES-10, severity: blocking, name: "Inversion of Control"}
  - {id: REV-DES-11, severity: blocking, name: "Configuration Isolation"}
  - {id: REV-DES-12, severity: optional, name: "Law of Demeter"}
  - {id: REV-DES-13, severity: optional, name: "Factory for Complex Instantiation"}
  - {id: REV-DES-14, severity: optional, name: "Facade for Subsystem"}
  - {id: REV-DES-15, severity: blocking, name: "DTO Cleanliness"}

  - {id: REV-FUN-01, severity: blocking, name: "Logical Correctness"}
  - {id: REV-FUN-02, severity: blocking, name: "Swallowed Exceptions"}
  - {id: REV-FUN-03, severity: blocking, name: "Unsafe File Open"}
  - {id: REV-FUN-04, severity: blocking, name: "Unprotected Exception Boundaries"}
  - {id: REV-FUN-05, severity: blocking, name: "Missing Network Timeout"}
  - {id: REV-FUN-06, severity: blocking, name: "Concurrency Locking"}
  - {id: REV-FUN-07, severity: blocking, name: "Deadlock Potential"}
  - {id: REV-FUN-08, severity: blocking, name: "Shell Injection Risk"}
  - {id: REV-FUN-09, severity: blocking, name: "SQL Injection Risk"}
  - {id: REV-FUN-10, severity: blocking, name: "Path Traversal Risk"}
  - {id: REV-FUN-11, severity: blocking, name: "Hardcoded Secrets"}
  - {id: REV-FUN-12, severity: blocking, name: "Unsafe Cryptographic Hash"}
  - {id: REV-FUN-13, severity: blocking, name: "Boundary Condition Errors"}
  - {id: REV-FUN-14, severity: blocking, name: "Mutable Default Arguments"}
  - {id: REV-FUN-15, severity: blocking, name: "Socket Closure Leak"}

  - {id: REV-CMP-01, severity: blocking, name: "Excessive Function Length / Too Many Args"}
  - {id: REV-CMP-02, severity: blocking, name: "Nesting Depth"}
  - {id: REV-CMP-03, severity: blocking, name: "High Cyclomatic Complexity"}
  - {id: REV-CMP-04, severity: optional, name: "Magic Numbers"}
  - {id: REV-CMP-05, severity: nit, name: "Unnecessary Boolean Evaluations"}
  - {id: REV-CMP-06, severity: blocking, name: "Dead Code"}
  - {id: REV-CMP-07, severity: blocking, name: "Recursion Depth Guard"}
  - {id: REV-CMP-08, severity: optional, name: "Variable Re-assignment Pollution"}
  - {id: REV-CMP-09, severity: blocking, name: "Ternary Operator Abuse"}
  - {id: REV-CMP-10, severity: nit, name: "Long Expression Splitting"}

  - {id: REV-TST-01, severity: blocking, name: "Required Test File Presence"}
  - {id: REV-TST-02, severity: blocking, name: "Test Case Coverage Density"}
  - {id: REV-TST-03, severity: blocking, name: "Mocking External Network Calls"}
  - {id: REV-TST-04, severity: blocking, name: "Mocking Database operations"}
  - {id: REV-TST-05, severity: blocking, name: "Assertions Quality"}
  - {id: REV-TST-06, severity: nit, name: "Test Name Readability"}
  - {id: REV-TST-07, severity: blocking, name: "Deterministic Testing"}
  - {id: REV-TST-08, severity: blocking, name: "Test Cleanliness"}

  - {id: REV-STY-01, severity: blocking, name: "PEP 8 Snake Case for Functions"}
  - {id: REV-STY-02, severity: blocking, name: "PEP 8 Pascal Case for Classes"}
  - {id: REV-STY-03, severity: blocking, name: "Meaningful Variable Names"}
  - {id: REV-STY-04, severity: blocking, name: "Unused Imported Modules"}
  - {id: REV-STY-05, severity: blocking, name: "Unused Local Variables"}
  - {id: REV-STY-06, severity: nit, name: "PEP 8 Import Ordering"}
  - {id: REV-STY-07, severity: nit, name: "Line Continuation Standards"}
  - {id: REV-STY-08, severity: nit, name: "Code Formatting Consistency"}

  - {id: REV-CMT-01, severity: blocking, name: "Comments explain Why not What"}
  - {id: REV-CMT-02, severity: blocking, name: "Public API Docstring Coverage"}
  - {id: REV-CMT-03, severity: blocking, name: "Unregistered TODO Comments"}
  - {id: REV-CMT-04, severity: nit, name: "Docstring Formatting"}
  - {id: REV-CMT-05, severity: blocking, name: "Regular Expression Comments"}
  - {id: REV-CMT-06, severity: blocking, name: "Math Algorithm Explanations"}
  - {id: REV-CMT-07, severity: blocking, name: "Up-to-date README/Docs"}

  - {id: REV-SIZ-01, severity: blocking, name: "One Self-Contained Scope"}
  - {id: REV-SIZ-02, severity: blocking, name: "Split Refactoring from Logic"}
  - {id: REV-SIZ-03, severity: optional, name: "Keep Changes Under 200 Lines"}
  - {id: REV-SIZ-04, severity: blocking, name: "Provide Calling Context"}
  - {id: REV-SIZ-05, severity: blocking, name: "CL Description Imperative Style"}
